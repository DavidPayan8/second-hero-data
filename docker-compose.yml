services:
  postgres:
    image: postgres:16
    container_name: second-hero-postgres
    environment:
      POSTGRES_USER: second_hero
      POSTGRES_PASSWORD: second_hero
      POSTGRES_DB: second_hero
    ports:
      - "5432:5432"
    volumes:
      - second_hero_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U second_hero -d second_hero"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  second_hero_pgdata:
